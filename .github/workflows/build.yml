name: Build and Release Magisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract Version & Generate Changelog
        id: release_info
        run: |
          # 1. Read version from module.prop
          VERSION=$(grep "^version=" module.prop | head -n1 | cut -d'=' -f2 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION="v3.1"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            TAG="v$VERSION"
          else
            TAG="$VERSION"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # 2. Get latest previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog since $PREV_TAG..."
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          else
            echo "Generating full changelog..."
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build arm64 binary
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o nfqttl main.go

      - name: Package Magisk Module ZIP
        run: |
          mkdir -p system/bin webroot
          cp scripts/ttlshield system/bin/ttlshield
          cp index.html webroot/index.html
          chmod +x nfqttl service.sh customize.sh action.sh system/bin/ttlshield
          ZIP_NAME="GKI_Hotspot_Shield_${{ steps.release_info.outputs.TAG }}.zip"
          zip -r9 "$ZIP_NAME" module.prop config.conf service.sh customize.sh action.sh nfqttl system webroot META-INF
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: "${{ steps.release_info.outputs.TAG }}"
          body: |
            ## What's Changed in ${{ steps.release_info.outputs.TAG }}
            
            ${{ steps.release_info.outputs.CHANGELOG }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
