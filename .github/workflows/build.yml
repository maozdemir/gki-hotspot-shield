name: Build and Release Magisk Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build arm64 binary
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o nfqttl main.go

      - name: Package Magisk Module ZIP
        run: |
          mkdir -p system/bin
          cp scripts/ttlshield system/bin/ttlshield
          chmod +x nfqttl service.sh customize.sh system/bin/ttlshield
          zip -r9 GKI_Hotspot_Shield_${{ github.ref_name }}.zip module.prop config.conf service.sh customize.sh nfqttl system META-INF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GKI_Hotspot_Shield_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
