name: Build and Release Magisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract Version from module.prop
        id: get_version
        run: |
          VERSION=$(grep "^version=" module.prop | head -n1 | cut -d'=' -f2 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION="v3.1"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            TAG="v$VERSION"
          else
            TAG="$VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION with tag: $TAG"

      - name: Build arm64 binary
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o nfqttl main.go

      - name: Package Magisk Module ZIP
        run: |
          mkdir -p system/bin webroot
          cp scripts/ttlshield system/bin/ttlshield
          cp index.html webroot/index.html
          chmod +x nfqttl service.sh customize.sh action.sh system/bin/ttlshield
          ZIP_NAME="GKI_Hotspot_Shield_${{ steps.get_version.outputs.TAG }}.zip"
          zip -r9 "$ZIP_NAME" module.prop config.conf service.sh customize.sh action.sh nfqttl system webroot META-INF
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "${{ steps.get_version.outputs.TAG }} - Automated Release"
          body: |
            ### 🛡️ GKI Hotspot Shield ${{ steps.get_version.outputs.TAG }}
            
            **Automated Magisk / KernelSU / APatch release:**
            - Real-time TTL / Hop Limit 64 Normalization (GKI bypass)
            - Transparent Encrypted DNS-over-HTTPS (DoH Proxy)
            - GoodbyeDPI / Zapret TLS ClientHello TCP Segmentation
            - Anti-Bufferbloat fq_codel QoS & Dynamic Wi-Fi Power Saver
            - In-App WebUI Dashboard & Magisk Action launcher
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
